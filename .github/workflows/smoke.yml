name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Camera lifecycle unit regression
        run: node --test tests/camera-lifecycle.cjs
      - name: Camera interruption browser regression
        run: node tests/camera-browser.cjs
      - name: Upload camera screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-390-and-320
          path: test-results/camera
      - name: Run smoke tests
        run: node tests/smoke.js
      - name: Short-screen onboarding regression
        run: node tests/onboarding-layout.cjs
      - name: Offline lifecycle regression
        run: node tests/offline.js
        env:
          SCREENSHOT_DIR: test-results/offline
      - name: Upload offline screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-390x844
          path: test-results/offline

