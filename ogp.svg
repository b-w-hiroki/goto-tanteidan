<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="28%" cy="12%" r="90%">
      <stop offset="0%" stop-color="#1d1d3a"/>
      <stop offset="60%" stop-color="#0c0c1c"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#b71f2b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- watermark glass -->
  <text x="980" y="540" font-size="520" opacity="0.06" fill="#ffffff" font-family="sans-serif">🔍</text>

  <!-- badge -->
  <rect x="80" y="96" rx="20" ry="20" width="232" height="44" fill="#E63946"/>
  <text x="104" y="126" font-size="22" font-weight="700" fill="#ffffff" font-family="'Hiragino Sans','Meiryo',sans-serif" letter-spacing="2">PROTOTYPE · 2026</text>

  <!-- title -->
  <text x="78" y="262" font-size="92" font-weight="800" fill="#ffffff" font-family="'Hiragino Sans','Meiryo',sans-serif">🔍 GO-TO 探偵団</text>

  <!-- lead -->
  <text x="82" y="340" font-size="36" fill="#A8C4D4" font-family="'Hiragino Sans','Meiryo',sans-serif">市民が「探偵」となり、街のマーキングを発見・投稿。</text>
  <text x="82" y="392" font-size="36" fill="#A8C4D4" font-family="'Hiragino Sans','Meiryo',sans-serif">AIが判定し、防犯マップがリアルタイムに育つ。</text>

  <!-- feature chips -->
  <g font-family="'Hiragino Sans','Meiryo',sans-serif">
    <rect x="80" y="470" rx="28" ry="28" width="300" height="56" fill="#1E2A40" stroke="#2A2A45"/>
    <text x="108" y="507" font-size="28" fill="#ffffff">📸 撮って投稿</text>

    <rect x="404" y="470" rx="28" ry="28" width="320" height="56" fill="#1E2A40" stroke="#2A2A45"/>
    <text x="432" y="507" font-size="28" fill="#ffffff">🤖 AIが自動判定</text>

    <rect x="748" y="470" rx="28" ry="28" width="372" height="56" fill="#1E2A40" stroke="#2A2A45"/>
    <text x="776" y="507" font-size="28" fill="#ffffff">⭐ ポイント＆ランキング</text>
  </g>
</svg>
