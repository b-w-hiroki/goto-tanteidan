<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="32%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#1d1d3a"/>
      <stop offset="65%" stop-color="#0c0c1c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#b71f2b"/>
    </linearGradient>
  </defs>

  <!-- maskable safe area: keep art within central 80% -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- magnifying glass -->
  <g transform="translate(150 150)">
    <circle cx="92" cy="92" r="92" fill="none" stroke="url(#ring)" stroke-width="34"/>
    <circle cx="92" cy="92" r="58" fill="rgba(244,162,97,0.12)"/>
    <rect x="168" y="168" width="120" height="40" rx="20" transform="rotate(45 168 168)" fill="url(#ring)"/>
  </g>
</svg>
